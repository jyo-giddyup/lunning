# fly.toml app configuration file generated for nil-predictor on 2026-07-20T18:30:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nil-predictor'
primary_region = 'iad'

[build]
  image = 'ghcr.io/jyo-giddyup/nil-predictor:latest'

[env]
  NIL_ARTIFACTS_DIR = '/app/artifacts'
  NIL_AUDIT_LOG = '/app/data/audit.log'
  NIL_CUSTOMER_DB = '/app/data/customers.db'
  PORT = '8000'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
