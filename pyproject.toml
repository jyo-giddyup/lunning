[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nil-predictor"
version = "0.1.1"
description = "Multi-target prediction models for college athlete NIL outcomes."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "httpx>=0.27",
  # Fairness methodology lives in the lunning- repo; required by the
  # tests/test_fairness_gate.py CI gate. The test module skips itself if
  # this package isn't importable, so dev installs without network can
  # still run the rest of the suite.
  "predictions @ git+https://github.com/jyo-giddyup/lunning-",
]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]

[project.scripts]
nil-train = "nil_predictor.train:main"
nil-predict = "nil_predictor.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
