[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nil-predictor"
version = "0.1.1"
description = "Multi-target prediction models for college athlete NIL outcomes."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]

[project.scripts]
nil-train = "nil_predictor.train:main"
nil-predict = "nil_predictor.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
