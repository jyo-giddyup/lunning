version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "@next/*", "react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        patterns: ["typescript", "tailwindcss", "postcss", "autoprefixer", "@types/*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
