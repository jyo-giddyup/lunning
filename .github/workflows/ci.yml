name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: pytest
        run: pytest -q

      - name: Train smoke
        run: |
          python -m nil_predictor.train --n 1000 --seed 1 --out artifacts/
          test -f artifacts/valuation.joblib
          test -f artifacts/metrics.json
